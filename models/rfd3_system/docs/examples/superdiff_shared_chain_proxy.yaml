# Example shape for the approximate shared-chain proxy mode.
# Replace the input path and contigs with a real ABC system.

example_abc:
  input: /path/to/abc_complex.pdb
  # The base contig must be valid enough for input validation. Track-specific
  # contigs below are applied after the source atom array is split by chain IDs.
  contig: A1-100,B1-100,C1-100
  select_fixed_atoms: false
  select_unfixed_sequence: true

# Example CLI overrides:
#
# PYTHONPATH=/path/to/foundry/models/rfd3_system/src:$PYTHONPATH \
# python -m rfd3_system.cli design \
#   inputs=docs/examples/superdiff_shared_chain_proxy.yaml \
#   out_dir=/path/to/outputs/rfd3_system/example \
#   coupling_mode=superdiff_shared_chain \
#   shared_chain_id=A \
#   complex_1_partners='[B]' \
#   complex_2_partners='[C]' \
#   inference_sampler.kind=superdiff_shared_chain \
#   inference_sampler.num_timesteps=20 \
#   inference_sampler.proxy_kappa_min=-1.0 \
#   inference_sampler.proxy_kappa_max=2.0 \
#   track_1_specification.contig=A1-100,B1-100 \
#   track_2_specification.contig=A1-100,C1-100
